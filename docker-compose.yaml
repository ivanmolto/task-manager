version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_secret
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: taskmanager-auth
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskmanager:taskmanager_secret@postgres:5432/taskmanager_auth?schema=public
      JWT_ACCESS_SECRET: secret-access-key-change-in-production
      JWT_REFRESH_SECRET: secret-refresh-key-change-in-production
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      TCP_HOST: 0.0.0.0
      TCP_PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanager-network

  # Task Service
  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: taskmanager-tasks
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://taskmanager:taskmanager_secret@postgres:5432/taskmanager_tasks?schema=public
      TCP_HOST: 0.0.0.0
      TCP_PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanager-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: taskmanager-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 4001
      TASK_SERVICE_HOST: task-service
      TASK_SERVICE_PORT: 4002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: secret-access-key-change-in-production
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/api/docs",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - auth-service
      - task-service
      - redis
    networks:
      - taskmanager-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - taskmanager-network

volumes:
  postgres_data:
  redis_data:

networks:
  taskmanager-network:
    driver: bridge
